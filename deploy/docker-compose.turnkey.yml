services:
  # 1. Petri Server — Zero-Trust Gateway
  #    Auth, SmartShield, auto-TLS, rate limiting, reverse proxy.
  #    This is the front door. All traffic flows through here.
  #    Base image: azukaar/cosmos-server (upstream engine)
  petri-server:
    image: azukaar/cosmos-server:latest
    container_name: petri-server
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3 QUIC
      - "4040:4040"     # Petri admin/management API
    environment:
      # Upstream image env vars (required by base image)
      - COSMOS_HTTP_PORT=80
      - COSMOS_HTTPS_PORT=443
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/petri/vault/server_data:/var/lib/cosmos  # upstream data path
      - /var/lib/petri/vault/server_config:/config
    depends_on:
      - petri-web
      - petri-engine
      - playwright-runner

  # 2. Petri Web UI (SPA)
  #    Internal only — Petri Server proxies authenticated traffic here.
  petri-web:
    build:
      context: ../openengine-mesh
      dockerfile: Dockerfile
    image: petri-web:latest
    container_name: petri-web
    restart: unless-stopped
    environment:
      - NODE_ENV=production

  # 3. Petri Engine — Rust Native Daemon & Cluster Server
  #    Handles /api/* and /ws/* behind Petri Server auth gate.
  petri-engine:
    build:
      context: ..
      dockerfile: docker/zero-target/Dockerfile
    image: petri-engine:latest
    container_name: petri-engine
    restart: unless-stopped
    environment:
      - RUST_LOG=info
      - PETRI_VAULT_PATH=/var/lib/petri/vault
      - DWD_IMPERSONATE_USER=j.sadol@bbs.ac.th
    volumes:
      - /var/lib/petri/vault:/var/lib/petri/vault
      - /var/run/docker.sock:/var/run/docker.sock

  # 4. Playwright Headless Chromium Operator Worker
  playwright-runner:
    image: mcr.microsoft.com/playwright:v1.49.0-noble
    container_name: petri-playwright-runner
    restart: unless-stopped
    ipc: host
    command: ["npx", "playwright", "run-server", "--port", "3000", "--host", "0.0.0.0"]
    volumes:
      - /var/lib/petri/vault/browser_vault:/vault

  # 5. Tailscale Mesh Subnet Router
  tailscale:
    image: tailscale/tailscale:latest
    container_name: petri-tailscale
    restart: unless-stopped
    hostname: petri-bangkok-turnkey
    environment:
      - TS_AUTHKEY=${TAILSCALE_AUTHKEY:-}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_EXTRA_ARGS=--advertise-tags=tag:server --accept-routes
    volumes:
      - /var/lib/petri/vault/tailscale:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
