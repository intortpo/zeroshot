services:
  # 1. Petri IAM & Zero-Trust Gateway — Zitadel v4 + PostgreSQL 16
  #    Enterprise OAuth2, OIDC discovery, Passkey/2FA, RBAC, organizations.
  #    This is the front door on ports 80/8080.
  petri-zitadel:
    image: ghcr.io/zitadel/zitadel:latest
    container_name: petri-zitadel
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /var/lib/petri/vault/zitadel/config.yaml:/config.yaml
    environment:
      - ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_ENABLED=false
      - ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED=false
    depends_on:
      - petri-postgres
    command: ["start", "--config", "/config.yaml", "--masterkey", "${ZITADEL_MASTERKEY:-PetriMasterKey32ByteString2026!!}"]

  # 1b. Persistent PostgreSQL 16 Backend for Zitadel on 50GB Vault Disk
  petri-postgres:
    image: postgres:16-alpine
    container_name: petri-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=zitadel
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-PetriPostgres2026!}
      - POSTGRES_DB=zitadel
    ports:
      - "5432:5432"
    volumes:
      - /var/lib/petri/vault/postgres:/var/lib/postgresql/data

  # 2. Petri Web UI (SPA) & Ingress Gateway
  petri-web:
    image: caddy:2-alpine
    container_name: petri-web
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - /opt/zero-petri/openengine-mesh/dist:/usr/share/caddy
      - /opt/zero-petri/openengine-mesh/Caddyfile:/etc/caddy/Caddyfile

  # 3. Petri Engine — Rust Native Daemon & Cluster Server
  #    Handles /api/* and /ws/* behind Petri Server auth gate.
  petri-engine:
    build:
      context: ..
      dockerfile: docker/zero-target/Dockerfile
    image: petri-engine:latest
    container_name: petri-engine
    restart: unless-stopped
    environment:
      - RUST_LOG=info
      - PETRI_VAULT_PATH=/var/lib/petri/vault
      - DWD_IMPERSONATE_USER=j.sadol@bbs.ac.th
    volumes:
      - /var/lib/petri/vault:/var/lib/petri/vault
      - /var/run/docker.sock:/var/run/docker.sock

  # 4. Playwright Headless Chromium Operator Worker
  playwright-runner:
    image: mcr.microsoft.com/playwright:v1.49.0-noble
    container_name: petri-playwright-runner
    restart: unless-stopped
    ipc: host
    command: ["npx", "playwright", "run-server", "--port", "3000", "--host", "0.0.0.0"]
    volumes:
      - /var/lib/petri/vault/browser_vault:/vault

  # 5. Tailscale Mesh Subnet Router
  tailscale:
    image: tailscale/tailscale:latest
    container_name: petri-tailscale
    restart: unless-stopped
    hostname: petri-bangkok-turnkey
    environment:
      - TS_AUTHKEY=${TAILSCALE_AUTHKEY:-}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_EXTRA_ARGS=--advertise-tags=tag:server --accept-routes
    volumes:
      - /var/lib/petri/vault/tailscale:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
