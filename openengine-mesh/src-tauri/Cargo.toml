[package]
name = "openengine-mesh-backend"
version = "0.1.0"
description = "Distributed mesh backend and multiplatform Tauri v2 coordinator for OpenEngine."
authors = ["OpenEngine Team"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "openengine_mesh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "openengine-mesh"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
openengine-cluster-protocol = { path = "../../crates/openengine-cluster-protocol" }
openengine-cluster-client = { path = "../../crates/openengine-cluster-client" }
zero_engine = { package = "zero", path = "../../zero" }
